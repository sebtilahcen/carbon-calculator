<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة البصمة الكربونية للشركات المصغرة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 40px 20px;
            direction: rtl;
            color: #333;
        }
        .carbon-calculator-card {
            max-width: 550px;
            background: #ffffff;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        h2 {
            color: #10b981;
            text-align: center;
            margin-bottom: 8px;
            font-size: 22px;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            direction: ltr;
            text-align: right;
        }
        input:focus {
            outline: none;
            border-color: #10b981;
        }
        button {
            width: 100%;
            background: #10b981;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #059669;
        }
        .btn-download {
            background: #3b82f6;
            margin-top: 12px;
        }
        .btn-download:hover {
            background: #2563eb;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 10px;
            text-align: center;
        }
        .result-box h3 {
            margin-top: 0;
            color: #065f46;
            font-size: 16px;
        }
        #mainResultText {
            font-size: 18px;
            font-weight: bold;
            color: #047857;
            margin: 10px 0;
        }
        .breakdown {
            font-size: 13px;
            color: #374151;
            margin-top: 10px;
            border-top: 1px dashed #a7f3d0;
            padding-top: 10px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="carbon-calculator-card">
    <h2>حاسبة البصمة الكربونية للشركات المصغرة</h2>
    <p class="subtitle">احسب الانبعاثات الشهرية لعملك واستخرج تقريرك الرسمي.</p>

    <div class="input-group">
        <label for="elec">استهلاك الكهرباء الشهري (كيلوواط/ساعة):</label>
        <input type="number" id="elec" placeholder="5000">
    </div>

    <div class="input-group">
        <label for="gas">استهلاك البنزين الشهري (لتر):</label>
        <input type="number" id="gas" placeholder="300">
    </div>

    <div class="input-group">
        <label for="diesel">استهلاك الديزل الشهري (لتر):</label>
        <input type="number" id="diesel" placeholder="40">
    </div>

    <button onclick="calculateCarbon()">احسب إجمالي الانبعاثات</button>

    <div class="result-box" id="resultBox" style="display: none;">
        <h3>نتيجة التحليل البيئي:</h3>
        <p id="mainResultText"></p>
        <div class="breakdown" id="breakdownText"></div>
        <button class="btn-download" onclick="downloadEnglishReport()">📥 Download English Report (.txt)</button>
    </div>
</div>

<script>
let lastReportData = {};

function calculateCarbon() {
    let electricity = parseFloat(document.getElementById('elec').value) || 0;
    let gasoline = parseFloat(document.getElementById('gas').value) || 0;
    let diesel = parseFloat(document.getElementById('diesel').value) || 0;

    const factorElec = 0.475;
    const factorGas = 2.31;
    const factorDiesel = 2.68;

    let emissionsElec = electricity * factorElec;
    let emissionsGas = gasoline * factorGas;
    let emissionsDiesel = diesel * factorDiesel;

    let totalKg = emissionsElec + emissionsGas + emissionsDiesel;
    let totalTonnes = totalKg / 1000;

    lastReportData = {
        elec: electricity,
        gas: gasoline,
        diesel: diesel,
        emElec: emissionsElec.toFixed(1),
        emGas: emissionsGas.toFixed(1),
        emDiesel: emissionsDiesel.toFixed(1),
        total: totalTonnes.toFixed(3),
        date: new Date().toISOString().slice(0, 10)
    };

    let resultBox = document.getElementById('resultBox');
    let mainText = document.getElementById('mainResultText');
    let breakdownText = document.getElementById('breakdownText');

    resultBox.style.display = 'block';
    
    mainText.innerHTML = `إجمالي البصمة: ${lastReportData.total} طن متري من CO₂`;
    
    breakdownText.innerHTML = `
        <strong>التفصيل حسب المصدر:</strong><br>
        - الكهرباء: ${lastReportData.emElec} كجم CO₂<br>
        - البنزين: ${lastReportData.emGas} كجم CO₂<br>
        - الديزل: ${lastReportData.emDiesel} كجم CO₂
    `;
}

function downloadEnglishReport() {
    if (!lastReportData.total) return;

    let reportText = `CARBON FOOTPRINT AUDIT REPORT\nDate: ${lastReportData.date}\n\n- Monthly Electricity Consumption: ${lastReportData.elec} kWh\n- Monthly Gasoline Consumption: ${lastReportData.gas} Liters\n- Monthly Diesel Consumption: ${lastReportData.diesel} Liters\n\nTotal Carbon Footprint: ${lastReportData.total} Metric Tonnes of CO2\n\nEmission Breakdown:\n- Electricity Emissions: ${lastReportData.emElec} kg CO2\n- Gasoline Emissions: ${lastReportData.emGas} kg CO2\n- Diesel Emissions: ${lastReportData.emDiesel} kg CO2`;

    let blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Carbon_Report_${lastReportData.date}.txt`;
    link.click();
}
</script>

</body>
</html>
