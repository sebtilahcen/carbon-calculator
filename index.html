<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Carbon Footprint & Sustainability Audit</title>
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --success-text: #166534;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 20px 10px;
            color: var(--text-main);
            line-height: 1.5;
        }
        .container {
            max-width: 600px;
            background: var(--card-bg);
            margin: 0 auto;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--primary);
            font-size: 20px;
            margin: 0 0 6px 0;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 13px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fff;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
        }
        .btn-calculate {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-calculate:hover {
            background: var(--primary-hover);
        }
        .result-section {
            margin-top: 25px;
            display: none;
        }
        .summary-card {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
        .summary-card h3 {
            margin: 0;
            font-size: 13px;
            color: var(--success-text);
            text-transform: uppercase;
        }
        .total-emissions {
            font-size: 22px;
            font-weight: 800;
            color: #14532d;
            margin: 6px 0;
        }
        .breakdown-list {
            font-size: 13px;
            text-align: left;
            border-top: 1px dashed var(--success-border);
            padding-top: 10px;
            margin-top: 10px;
            color: #374151;
        }
        .recommendations-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .recommendations-box h4 {
            margin: 0 0 8px 0;
            color: #1e40af;
            font-size: 14px;
        }
        .recommendations-box ul {
            margin: 0;
            padding-left: 18px;
            font-size: 13px;
            color: #1e3a8a;
        }
        .recommendations-box li {
            margin-bottom: 6px;
        }
        .btn-download {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-download:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Carbon Footprint & Audit Tool</h1>
        <p class="subtitle">Small business environmental assessment toolkit.</p>
    </header>

    <div class="input-group">
        <label for="elec">Monthly Electricity (kWh)</label>
        <input type="number" id="elec" placeholder="e.g., 4000" min="0">
    </div>

    <div class="input-group">
        <label for="gas">Monthly Gasoline (Liters)</label>
        <input type="number" id="gas" placeholder="e.g., 250" min="0">
    </div>

    <div class="input-group">
        <label for="diesel">Monthly Diesel (Liters)</label>
        <input type="number" id="diesel" placeholder="e.g., 100" min="0">
    </div>

    <div class="input-group">
        <label for="lpg">Natural Gas / LPG (Units)</label>
        <input type="number" id="lpg" placeholder="e.g., 50" min="0">
    </div>

    <div class="input-group">
        <label for="logistics">Freight & Delivery Logistics (Est. km)</label>
        <input type="number" id="logistics" placeholder="e.g., 1200" min="0">
    </div>

    <button class="btn-calculate" onclick="calculateCarbonFootprint()">Calculate & Generate Audit</button>

    <div class="result-section" id="resultSection">
        <div class="summary-card">
            <h3>Total Estimated Carbon Emissions</h3>
            <div class="total-emissions" id="totalOutput">0.00 Metric Tonnes CO₂ / mo</div>
            <div class="breakdown-list" id="breakdownOutput"></div>
        </div>

        <div class="recommendations-box">
            <h4>💡 Strategic Recommendations:</h4>
            <ul id="recsList"></ul>
        </div>

        <button class="btn-download" onclick="downloadReportTxt()">📥 Download Official Audit Report (.txt)</button>
    </div>
</div>

<script>
let globalData = {};

function calculateCarbonFootprint() {
    let elec = parseFloat(document.getElementById('elec').value) || 0;
    let gas = parseFloat(document.getElementById('gas').value) || 0;
    let diesel = parseFloat(document.getElementById('diesel').value) || 0;
    let lpg = parseFloat(document.getElementById('lpg').value) || 0;
    let logistics = parseFloat(document.getElementById('logistics').value) || 0;

    const fElec = 0.475;
    const fGas = 2.31;
    const fDiesel = 2.68;
    const fLpg = 2.98;
    const fLogistics = 0.21;

    let eElec = elec * fElec;
    let eGas = gas * fGas;
    let eDiesel = diesel * fDiesel;
    let eLpg = lpg * fLpg;
    let eLogistics = logistics * fLogistics;

    let totalKg = eElec + eGas + eDiesel + eLpg + eLogistics;
    let totalTonnes = totalKg / 1000;

    globalData = {
        elec, gas, diesel, lpg, logistics,
        eElec: eElec.toFixed(1),
        eGas: eGas.toFixed(1),
        eDiesel: eDiesel.toFixed(1),
        eLpg: eLpg.toFixed(1),
        eLogistics: eLogistics.toFixed(1),
        total: totalTonnes.toFixed(3),
        date: new Date().toISOString().slice(0, 10)
    };

    let recs = [];
    if (elec > 1500) {
        let solarKw = Math.ceil(elec / 130);
        recs.push(`<strong>Solar PV Transition:</strong> High electricity usage indicates strong feasibility for a rooftop Solar PV system of ~<strong>${solarKw} kW</strong>, cutting grid reliance by up to 70%.`);
        recs.push(`<strong>Energy Efficiency:</strong> Upgrade to automated LED lighting and smart climate controls.`);
    } else {
        recs.push(`<strong>Energy Conservation:</strong> Perform routine maintenance on electrical and office equipment.`);
    }

    if (gas > 200 || diesel > 100 || logistics > 800) {
        recs.push(`<strong>Fleet Optimization:</strong> Streamline transport routes and consider adopting hybrid/electric delivery vehicles.`);
    }

    recs.push(`<strong>Continuous Monitoring:</strong> Conduct quarterly audits to track carbon milestones and lower overheads.`);

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('totalOutput').innerHTML = `${globalData.total} Metric Tonnes CO₂ / mo`;
    
    document.getElementById('breakdownOutput').innerHTML = `
        <div>- Electricity: <strong>${globalData.eElec} kg CO₂</strong></div>
        <div>- Gasoline: <strong>${globalData.eGas} kg CO₂</strong></div>
        <div>- Diesel: <strong>${globalData.eDiesel} kg CO₂</strong></div>
        <div>- Natural Gas/LPG: <strong>${globalData.eLpg} kg CO₂</strong></div>
        <div>- Logistics/Freight: <strong>${globalData.eLogistics} kg CO₂</strong></div>
    `;

    document.getElementById('recsList').innerHTML = recs.map(r => `<li>${r}</li>`).join('');
}

function downloadReportTxt() {
    if (!globalData.total) return;

    let textContent = `====================================================\n` +
                      `   ENTERPRISE CARBON FOOTPRINT & SUSTAINABILITY AUDIT\n` +
                      `====================================================\n` +
                      `Audit Date: ${globalData.date}\n\n` +
                      `1. OPERATIONAL ACTIVITY INPUTS:\n` +
                      `- Monthly Electricity: ${globalData.elec} kWh\n` +
                      `- Monthly Gasoline: ${globalData.gas} Liters\n` +
                      `- Monthly Diesel: ${globalData.diesel} Liters\n` +
                      `- Natural Gas / LPG: ${globalData.lpg} Units\n` +
                      `- Logistics / Freight: ${globalData.logistics} km\n\n` +
                      `2. DETAILED EMISSIONS BREAKDOWN (kg CO2):\n` +
                      `- Electricity Emissions: ${globalData.eElec} kg\n` +
                      `- Gasoline Emissions: ${globalData.eGas} kg\n` +
                      `- Diesel Emissions: ${globalData.eDiesel} kg\n` +
                      `- Natural Gas / LPG Emissions: ${globalData.eLpg} kg\n` +
                      `- Logistics Emissions: ${globalData.eLogistics} kg\n\n` +
                      `3. TOTAL CARBON FOOTPRINT:\n` +
                      `=> ${globalData.total} Metric Tonnes of CO2 equivalent / Month\n\n` +
                      `4. STRATEGIC RECOMMENDATIONS & DECARBONIZATION:\n` +
                      `- Renewable Energy Integration: Evaluate commercial solar panel configurations.\n` +
                      `- Fleet & Logistics Modernization: Streamline distribution paths.\n` +
                      `- Resource Efficiency: Establish systematic energy management protocols.\n\n` +
                      `* Disclaimer: Preliminary baseline internal auditing tool.\n`;

    let blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
    let link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Enterprise_Carbon_Audit_${globalData.date}.txt`;
    link.click();
}
</script>

</body>
</html>
